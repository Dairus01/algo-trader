name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q
      - name: Reproduce pinned 10-year risk profiles
        run: |
          python scripts/fetch_research_data.py
          python scripts/backtest_10y.py --profile core
          python scripts/backtest_10y.py --profile aggressive
          python scripts/backtest_10y.py --profile moonshot
      - name: Sweep intermediate risk levels
        run: python scripts/risk_sweep_10y.py
      - name: Search lower-risk 100-percent-day candidates
        run: python scripts/moonshot_search.py
      - name: Search high-reward lower-risk moonshots
        run: python scripts/moonshot_lowrisk_search.py
