name: ml-m1-portfolio

on:
  push:
    paths:
      - "scripts/ml_portfolio_m1.py"
      - "requirements.txt"
      - ".github/workflows/ml-portfolio.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python scripts/fetch_multisymbol_m1.py
      - run: python scripts/ml_portfolio_m1.py
