name: multisymbol-m1-research

on:
  push:
    paths:
      - "algo_trader/portfolio_scalper.py"
      - "scripts/fetch_multisymbol_m1.py"
      - "scripts/multisymbol_m1_sweep.py"
      - ".github/workflows/multisymbol.yml"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Fetch six pinned M1 markets
        run: python scripts/fetch_multisymbol_m1.py
      - name: Screen portfolio strategies
        run: python scripts/multisymbol_m1_sweep.py
