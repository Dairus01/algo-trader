name: raw-g75-independent-replay

on:
  push:
    paths:
      - "scripts/g75_raw_duka_bt.py"
      - "scripts/g75_raw_grid.py"
      - ".github/workflows/raw-g75.yml"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Replay all G75 variants on one raw tick stream
        run: python scripts/g75_raw_grid.py
      - uses: actions/upload-artifact@v4
        with:
          name: g75-raw-grid
          path: results/g75_raw_grid.json
