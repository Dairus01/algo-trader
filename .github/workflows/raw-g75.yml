name: raw-g75-independent-replay

on:
  push:
    paths:
      - "scripts/g75_raw_duka_bt.py"
      - ".github/workflows/raw-g75.yml"
  workflow_dispatch:

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        tf_sec: [15, 30, 60]
        variant: [A, B, C]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Raw Dukascopy train replay
        run: |
          python scripts/g75_raw_duka_bt.py \
            --start 2026-07-27 --days 7 \
            --tf-sec ${{ matrix.tf_sec }} \
            --variant ${{ matrix.variant }} \
            --out results/g75_raw/train_${{ matrix.tf_sec }}_${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g75-train-${{ matrix.tf_sec }}-${{ matrix.variant }}
          path: results/g75_raw/*.json
