[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-xauusd-trader"
version = "0.1.0"
description = "Causality-safe autonomous XAUUSD trend-breakout trader"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "requests>=2.32"]

[project.optional-dependencies]
live = ["MetaTrader5>=5.0.45"]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["algo_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
